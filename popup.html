<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CartWise</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
  <header class="top">
    <img src="icons/icon48.png" alt="" width="28" height="28">
    <div class="top-text">
      <h1>CartWise</h1>
      <p id="subtitle" data-i18n="subtitle"></p>
    </div>
    <button id="refresh" class="icon-btn" data-i18n-title="refresh" data-i18n-aria="refresh" title="Refresh prices" aria-label="Refresh prices">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button id="settings-btn" class="icon-btn" data-i18n-title="settings" data-i18n-aria="settings" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg>
    </button>
  </header>

  <section id="welcome" class="welcome" hidden>
    <h2 data-i18n="welcomeTitle"></h2>
    <ol>
      <li data-i18n-html="welcome1"></li>
      <li data-i18n-html="welcome2"></li>
      <li data-i18n-html="welcome3"></li>
    </ol>
    <p data-i18n-html="welcomeSettings"></p>
    <button id="welcome-ok" class="btn primary" data-i18n="gotIt"></button>
  </section>

  <section id="settings" class="settings" hidden>
    <label class="switch" data-i18n-title="plusTitle" title="With Skroutz Plus, eligible shipments are delivered free">
      <input type="checkbox" id="plus">
      <span class="track"><span class="thumb"></span></span>
      <span data-i18n-html="plusLabel">I have <b>Skroutz Plus</b></span>
    </label>
    <label class="switch" data-i18n-title="bpTitle" title="">
      <input type="checkbox" id="bp-on">
      <span class="track"><span class="thumb"></span></span>
      <span data-i18n-html="bpLabel"></span>
    </label>
    <div class="set-row">
      <span data-i18n="deliveryTo">Skroutz delivery to</span>
      <div class="segmented" role="radiogroup" data-i18n-aria="delivery" aria-label="Delivery">
        <label><input type="radio" name="delivery" value="point"><span data-i18n="point">Skroutz Point</span></label>
        <label><input type="radio" name="delivery" value="home"><span data-i18n="home">Home</span></label>
      </div>
    </div>
    <p class="set-hint" data-i18n="bpHomeHint"></p>
    <div class="set-row">
      <label for="avail" data-i18n="availability">Availability</label>
      <select id="avail" class="set-select">
        <option value="any" data-i18n="availAny">All offers</option>
        <option value="stock" data-i18n="availStock">In stock only</option>
        <option value="now" data-i18n="availNow">Immediately available only</option>
      </select>
    </div>
    <div class="set-row">
      <label for="max-days" data-i18n="deliveryWithin">Delivery within</label>
      <select id="max-days" class="set-select">
        <option value="0" data-i18n="anyTime">Any time</option>
        <option value="3" data-i18n="nDays" data-i18n-n="3">3 days</option>
        <option value="5" data-i18n="nDays" data-i18n-n="5">5 days</option>
        <option value="7" data-i18n="nDays" data-i18n-n="7">7 days</option>
        <option value="10" data-i18n="nDays" data-i18n-n="10">10 days</option>
        <option value="14" data-i18n="nDays" data-i18n-n="14">14 days</option>
      </select>
    </div>
    <div class="set-row">
      <span data-i18n="language">Language</span>
      <div class="segmented" role="radiogroup" data-i18n-aria="language" aria-label="Language">
        <label><input type="radio" name="lang" value="en"><span>English</span></label>
        <label><input type="radio" name="lang" value="el"><span>Ελληνικά</span></label>
      </div>
    </div>
    <details class="assumptions">
      <summary data-i18n="howShipping">How shipping is calculated</summary>
      <ul>
        <li data-i18n-html="rule1"></li>
        <li data-i18n-html="rule2"></li>
        <li data-i18n-html="rule3"></li>
        <li data-i18n-html="rule4"></li>
        <li data-i18n-html="rule5"></li>
        <li data-i18n-html="rule6"></li>
        <li data-i18n-html="rule7"></li>
        <li data-i18n-html="rule8"></li>
        <li data-i18n-html="rule9"></li>
      </ul>
    </details>
    <div class="set-row links">
      <button id="guide-btn" class="link-btn" type="button" data-i18n="showGuide"></button>
      <a class="link-btn" href="https://github.com/ekilaroglou/cartwise/blob/main/PRIVACY.md" target="_blank" rel="noreferrer" data-i18n="privacy"></a>
    </div>
  </section>

  <section class="add">
    <button id="add-current" class="btn primary idle" disabled></button>
    <p id="add-msg" class="msg" hidden></p>
  </section>

  <section>
    <div class="section-head">
      <h2><button id="cart-toggle" class="fold" type="button" aria-expanded="true" aria-controls="products" disabled>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        <span data-i18n="products">Products</span> <span id="count" class="pill">0</span></button></h2>
      <div class="actions">
        <button id="undo" class="btn small" data-i18n="undo" data-i18n-title="undoTitle" disabled>↶ Undo</button>
        <button id="clear" class="btn small danger" data-i18n="clear" data-i18n-title="clearTitle" disabled>Empty cart</button>
      </div>
    </div>
    <ul id="products" class="products"></ul>
  </section>

  <section id="results" hidden>
    <div id="tabs" class="tabs"></div>
    <div id="panel" class="results" hidden></div>
  </section>

  </div>

  <script src="boot.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
